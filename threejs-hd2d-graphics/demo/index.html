<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>科学文明再建ゲーム — HD-2Dグラフィック デモ</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <h1>HD-2D グラフィック デモ</h1>
      <p class="hint">WASD / 矢印キー：検証用ドライバで移動（正式な入力系ではありません）</p>
      <div class="row">
        <button id="btn-campfire" type="button">焚き火を置く</button>
        <button id="btn-workbench" type="button">作業台を置く</button>
        <button id="btn-kiln" type="button">窯を置く</button>
      </div>
      <div class="row">
        <button id="btn-effect" type="button">発見エフェクト</button>
        <button id="btn-deplete" type="button">木を採取済みにする</button>
        <button id="btn-chara" type="button">主人公を女の子に切替</button>
      </div>
      <div class="row slider">
        <label for="tod">時刻</label>
        <input id="tod" type="range" min="0" max="100" value="44" />
      </div>
      <div class="row slider">
        <label for="weather">天気</label>
        <select id="weather">
          <option value="clear">晴れ</option>
          <option value="cloudy">曇り</option>
          <option value="rain">雨</option>
          <option value="fog">霧</option>
        </select>
      </div>
      <p id="status" class="hint"></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
