<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゼロからの科学 〜石と水と木から〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eaf1ea; --card:#ffffff; --ink:#22305a; --muted:#5c6878; --line:#cbd8cd;
  --meadow:#3e6b4a; --meadow-ink:#ffffff; --sun:#f2b632; --clay:#b4483b; --soft:#f4f8f3;
  --sky1:#bfe3f2; --sky2:#eef8f1; --hill:#9cc49a; --hill2:#7fae80; --ground:#c9b88c; --tree:#4f7d4f; --trunk:#7a5a3c;
  --land:#a9cf8e; --land2:#c3d9a5; --sea:#6fb3d6; --wall:#efe7d6; --wall2:#ddd0b6; --floor:#b7a07a; --wood:#8a643f; --wood2:#6e4e30; --stone:#9a9c98; --stone2:#7b7d79;
  --shadow:0 2px 0 rgba(34,48,90,.08);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#131b18; --card:#1b2521; --ink:#e3eaf3; --muted:#9eabb8; --line:#2d3b35; --meadow:#7fbf8f; --meadow-ink:#10201a; --soft:#18221e;
    --sky1:#22385a; --sky2:#3a4f63; --hill:#2f4a3a; --hill2:#26402f; --ground:#4a4232; --tree:#24402c; --trunk:#4f3a28;
    --land:#2f4a36; --land2:#3a5640; --sea:#2c5a78; --wall:#3a3428; --wall2:#2f2a20; --floor:#3f3526; --wood:#6a4d33; --wood2:#4e3824; --stone:#6f716d; --stone2:#5a5c58; --clay:#e08a7c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#131b18; --card:#1b2521; --ink:#e3eaf3; --muted:#9eabb8; --line:#2d3b35; --meadow:#7fbf8f; --meadow-ink:#10201a; --soft:#18221e;
  --sky1:#22385a; --sky2:#3a4f63; --hill:#2f4a3a; --hill2:#26402f; --ground:#4a4232; --tree:#24402c; --trunk:#4f3a28;
  --land:#2f4a36; --land2:#3a5640; --sea:#2c5a78; --wall:#3a3428; --wall2:#2f2a20; --floor:#3f3526; --wood:#6a4d33; --wood2:#4e3824; --stone:#6f716d; --stone2:#5a5c58; --clay:#e08a7c;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#1f2d24;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-weight:500;line-height:1.7;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
/* カメラの操作（描画モジュールに setCameraView があるときだけ出す） */
.wmapbox{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin:4px 0 10px}
#wmap{width:240px;height:240px;max-width:100%;border-radius:10px;border:2px solid rgba(0,0,0,.25);image-rendering:auto;background:#5a8a4a}
.wmapkey{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.7}.wmapkey i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.camctl{position:absolute;right:calc(var(--sar,0px) + 10px);top:calc(var(--sat,0px) + 70px);z-index:4;pointer-events:auto}
.camctl[hidden]{display:none}
.camctl button{height:32px;padding:0 9px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.88);font:inherit;font-size:.74rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:4px;touch-action:manipulation}
[data-ui="touch"] .camctl{top:auto;bottom:calc(var(--navh,64px) + 150px)}
[data-ui="touch"] .camctl button span{display:none}
[data-ui="touch"] .camctl button{width:38px;height:38px;padding:0;justify-content:center;font-size:1rem}
.camdbg{position:absolute;left:calc(var(--sal,0px) + 8px);bottom:calc(var(--navh,64px) + 8px);z-index:4;white-space:pre;font:11px/1.35 ui-monospace,monospace;background:rgba(0,0,0,.62);color:#fff;padding:4px 7px;border-radius:6px;pointer-events:none}
[data-ui="touch"] .camdbg{bottom:auto;top:calc(var(--sat,0px) + 132px)}
.camsens{display:grid;grid-template-columns:auto 1fr 2.4em;gap:6px 10px;align-items:center;max-width:420px}
.camsens input{width:100%;touch-action:pan-x}.camsens output{font-weight:800;text-align:right}
/* 集落の人との会話 */
.talk .tname{font-weight:900;font-size:1.1rem}.talk .tname small{font-weight:700;color:var(--muted);margin-left:4px}
.talk .tline{font-size:1.02rem;line-height:1.8;margin:10px 0 4px;min-height:3.6em}
/* 建築モード（置き場所を決める帯と、地面の枠） */
.buildbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--navh,64px) + 12px);z-index:6;background:rgba(255,255,255,.96);border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.28);padding:8px 10px;width:min(94vw,520px);pointer-events:auto}
.buildbar[hidden]{display:none}
.bbtitle{font-weight:900;font-size:.95rem}.bbmsg{font-size:.82rem;font-weight:700;margin:2px 0 6px}.bbmsg.ok{color:#2d6a3e}.bbmsg.ng{color:#a3262f}
.bbrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}.bbrow button{font:inherit;font-weight:800;min-height:44px;min-width:56px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.bbrow .bbok{background:var(--meadow);color:var(--meadow-ink);border:none;flex:1}.bbrow .bbok:disabled{opacity:.45}
.bbgrid{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;margin-left:auto}.bbgrid input{width:22px;height:22px}
.game.placing .w3act,.game.placing .joy{visibility:visible}
#buildov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.blist .bit{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px;margin:6px 0;background:var(--card)}
.blist .bit .n{flex:1;font-weight:800}.blist .bit small{display:block;font-weight:500;color:var(--muted)}
/* 検証モード（全解放）の表示と画面 */
.vbadge{display:block;margin:0 0 6px;border:2px solid #b23a48;background:#fff3f4;color:#8c1f2c;font-weight:900;font-size:.8rem;border-radius:999px;padding:3px 12px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18);pointer-events:auto}
.vbadge[hidden]{display:none}
.vsec{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;background:var(--card)}
.vsec h4{margin:0 0 6px;font-size:.95rem}
.vgrid{display:flex;flex-wrap:wrap;gap:6px}
.vgrid .btn{min-height:40px}
.vtbl{width:100%;border-collapse:collapse;font-size:.82rem}.vtbl td{border-bottom:1px solid var(--line);padding:3px 4px;vertical-align:top}.vtbl td:last-child{text-align:right;font-weight:900}
.vtog{display:flex;align-items:center;gap:8px;padding:5px 0;font-weight:700;font-size:.9rem}.vtog input{width:22px;height:22px}
.vrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.vrow input[type=search],.vrow input[type=number]{font:inherit;padding:8px;border:1.5px solid var(--line);border-radius:10px;min-height:40px}
.vrow input[type=search]{flex:1;min-width:140px}.vrow input[type=number]{width:80px}
.vlist{max-height:220px;overflow:auto;touch-action:pan-y;border:1px solid var(--line);border-radius:10px;padding:4px}
.vlist .vit{display:flex;align-items:center;gap:6px;padding:4px;border-bottom:1px dashed var(--line);font-size:.85rem}.vlist .vit span.n{flex:1}
.vwarn{color:#8c1f2c;font-weight:900}
.vgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.vgal figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:.7rem;background:#fff;word-break:break-all}
.vgal img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 4px}
.vgal .iic{font-size:48px;display:block;margin:0 auto 4px}
.vtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
/* 操作中に文字選択・画像ドラッグ・長押しメニューが出ないようにする（ゲームの文書全体。#app の外のモーダル・通知も含む）。
   編集できる入力欄（読み込み欄・書き出し欄・選択肢）だけは例外で、入力・選択・貼り付けができる */
body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;user-drag:none}
input,textarea,select,[contenteditable],[contenteditable] *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* タッチ操作は領域ごと：マップ（.stage）とスティックは none、ボタン類は manipulation（ダブルタップ拡大の待ちをなくす）、
   パネル・案内・図鑑は縦スクロールを残す。ゲーム全体には none を付けない（スクロールが効かなくなるため） */
button,summary,a,[role=button],.chip,.node,.w3lab,select{touch-action:manipulation}
.joy,.joy *{touch-action:none}
.sheet{touch-action:pan-y;overscroll-behavior:contain}
button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ===== ゲーム画面：表示領域全体がマップ。HUD・パネル・ナビはその上に重ねる ===== */
.game{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#3b5a3a;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;z-index:0}
.hud{position:absolute;inset:0;z-index:10;pointer-events:none}
.hud button,.hud summary,.hud .mission,.hud .joy{pointer-events:auto}
.hud-tl{position:absolute;left:calc(var(--sal) + 10px);top:calc(var(--sat) + 10px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:min(64vw,440px)}
.loc{background:rgba(20,28,40,.84);color:#fff;border-radius:12px;padding:3px 10px;font-size:.84rem;font-weight:700;line-height:1.5;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.loc small{opacity:.85;margin-left:4px;font-weight:500}
.hud-tr{position:absolute;right:calc(var(--sar) + 10px);top:calc(var(--sat) + 10px);display:flex;gap:6px}
.hbtn{min-width:48px;min-height:48px;border:none;border-radius:14px;background:rgba(255,255,255,.94);color:#22305a;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.66rem;font-weight:900;line-height:1.15;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;padding:3px 6px}
.hbtn span{font-size:1.2rem;line-height:1.1}
.hbtn[aria-expanded="true"]{background:var(--sun);color:#3a2c00}

/* 目標（1行。押すと詳細） */
.mission{background:rgba(255,255,255,.95);color:#22305a;border:2px solid #3e6b4a;border-radius:14px;padding:0 10px;max-width:100%;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mission summary{display:flex;gap:6px;align-items:center;cursor:pointer;list-style:none;min-height:44px}
.mission summary::-webkit-details-marker{display:none}
.owl{font-size:1.3rem;line-height:1;flex:0 0 auto}
.mission .mtx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.mission .lab{font-size:.64rem;font-weight:700;color:#3e6b4a}
.mission .t{font-weight:900;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mission[open] .t{white-space:normal}
.mission .more::after{content:"▼";font-size:.7rem;color:#5c6878}
.mission[open] .more::after{content:"▲"}
.mission .how{font-size:.82rem;color:#4a5566;margin:0 0 6px}
.mission .go{margin:0 0 8px;min-height:44px}

/* 下部ナビ */
.nav{position:absolute;z-index:45;display:flex;background:rgba(255,255,255,.96);box-shadow:0 -2px 12px rgba(0,0,0,.2)}
.nav button{border:none;background:none;border-radius:12px;font-weight:900;color:#4a5566;display:flex;align-items:center;justify-content:center;cursor:pointer}
.nav button span{line-height:1.1}
.nav button[aria-current="page"],.nav button[aria-expanded="true"]{color:#2c5a3a;background:#e3efe4;box-shadow:inset 0 -3px 0 #3e6b4a}
[data-ui="touch"] .nav{left:0;right:0;bottom:0;padding:4px calc(var(--sar) + 8px) calc(var(--sab) + 4px) calc(var(--sal) + 8px);gap:4px;border-radius:16px 16px 0 0}
[data-ui="touch"] .nav button{flex:1;min-height:52px;flex-direction:column;font-size:.74rem;gap:0}
[data-ui="touch"] .nav button span{font-size:1.35rem}
[data-ui="pc"] .nav{left:50%;bottom:calc(var(--sab) + 12px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:5px;gap:4px;border-radius:18px}
.nav button,.hbtn{white-space:nowrap}
[data-ui="pc"] .nav button{min-height:44px;padding:0 14px;gap:6px;font-size:.9rem}
[data-ui="pc"] .nav button span{font-size:1.1rem}
[data-ui="pc"] [data-only="touch"],[data-ui="touch"] [data-only="pc"]{display:none !important}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--card);color:var(--ink);border:1.5px solid var(--line);white-space:nowrap}
.chip b{font-weight:900}
/* ボタン（共通） */
.btn{border:none;border-radius:12px;padding:9px 14px;min-height:44px;font-weight:900;cursor:pointer;background:var(--meadow);color:var(--meadow-ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.sub{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.btn.small{padding:6px 10px;min-height:36px;font-size:.82rem;border-radius:10px}
.btn.big{font-size:1.1rem;padding:13px 18px;flex:1}
/* アイコン：通常・選択中・無効・フォーカスを区別する */
.ico{display:inline-block;line-height:1.1}
img.ico{width:32px;height:32px;object-fit:contain;image-rendering:pixelated}
[data-ui="pc"] .nav img.ico{width:28px;height:28px}
/* 物質アイコン（アトラスの1マス。大きさは文字の大きさに合わせる） */
/*  「.need span」などの汎用の span 指定（背景・枠・余白）に上書きされないよう !important を付ける */
.iic{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.25em;flex:none;
  margin:0 .08em 0 0 !important;padding:0 !important;border:0 !important;border-radius:0 !important;box-shadow:none !important;
  background:var(--iat) no-repeat !important;
  background-size:calc(var(--iat-c) * 100%) calc(var(--iat-r) * 100%) !important;
  background-position:calc(var(--c) * 100% / (var(--iat-c) - 1)) calc(var(--r) * 100% / (var(--iat-r) - 1)) !important}
/* 道具・設備・操作のアイコン（別のアトラス。大きさの決まりは物質アイコンと同じ） */
.tic{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.25em;flex:none;
  margin:0 .08em 0 0 !important;padding:0 !important;border:0 !important;border-radius:0 !important;box-shadow:none !important;
  background:var(--tat) no-repeat !important;
  background-size:calc(var(--tat-c) * 100%) calc(var(--tat-r) * 100%) !important;
  background-position:calc(var(--c) * 100% / (var(--tat-c) - 1)) calc(var(--r) * 100% / (var(--tat-r) - 1)) !important}
.sheet .bigi .iic,.prod .i .iic,.dx .i .iic,.toast .i .iic,.sheet .bigi .tic,.prod .i .tic,.dx .i .tic,.toast .i .tic{width:1.15em;height:1.15em}
.hbtn img.ico{width:28px;height:28px}
.bigitem img.ico{width:44px;height:44px}
.bigitem .ico.emo{font-size:1.8rem}
.nav button:hover:not(:disabled),.hbtn:hover:not(:disabled){filter:brightness(1.06)}
.nav button:disabled,.hbtn:disabled{opacity:.45;filter:grayscale(1);cursor:default}
.nav button[aria-current="page"] img.ico,.hbtn[aria-expanded="true"] img.ico{transform:translateY(-1px) scale(1.08)}
.nav button:focus-visible,.hbtn:focus-visible{outline:3px solid #f2b632;outline-offset:2px}
.kbd{display:inline-block;min-width:1.5em;padding:0 5px;border-radius:6px;border:1.5px solid currentColor;font-size:.75em;font-weight:900;line-height:1.5;text-align:center;opacity:.85}

/* 研究室 */
.labgrid{display:grid;gap:12px}
@media (min-width:900px){ .labgrid{grid-template-columns:1.15fr .85fr;align-items:start} .labgrid .stagebox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)} }
.stagebox{position:relative;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:var(--sky2)}
.scene{display:block;width:100%;height:auto}
.stagelabel{position:absolute;left:10px;top:8px;background:rgba(255,255,255,.88);color:#22305a;border-radius:10px;padding:2px 10px;font-size:.78rem;font-weight:900}
.temp{position:absolute;right:10px;top:8px;background:rgba(255,255,255,.9);color:#22305a;border-radius:10px;padding:2px 10px;font-size:.85rem;font-weight:900;opacity:0;transition:opacity .3s}
.temp.on{opacity:1}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px}
.panel h3{margin:0 0 8px;font-size:.95rem;font-weight:900;display:flex;align-items:center;gap:6px}
.panel h3 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--meadow);color:var(--meadow-ink);font-size:.75rem}
.tray{min-height:54px;border:2px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tray .ph{color:var(--muted);font-size:.84rem;padding:0 6px}
.mat{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:5px 9px;font-size:.84rem;font-weight:700;cursor:pointer;line-height:1.3}
.mat .i{font-size:1.15rem}
.mat .q{font-weight:900;color:var(--meadow)}
.mat.intray{background:var(--meadow);color:var(--meadow-ink);border-color:var(--meadow)}
.mat.intray .q{color:inherit}
.mat:disabled{opacity:.35;cursor:default}
.shelf{display:flex;flex-wrap:wrap;gap:6px;max-height:210px;overflow:auto;padding:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:7px 11px;font-weight:700;font-size:.86rem;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--meadow);background:var(--meadow);color:var(--meadow-ink)}
.desc{font-size:.84rem;color:var(--muted);margin:6px 0 0;min-height:1.4em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mt{margin-top:10px}

/* 結果ノート */
.note{border-radius:16px;padding:12px 14px;background:var(--card);border:2px solid var(--line);margin-top:12px}
.note.good{border-color:var(--meadow)}
.note.new{border-color:var(--sun);box-shadow:0 0 0 4px rgba(242,182,50,.2)}
.note.bad{border-color:var(--clay)}
.note h4{margin:0 0 4px;font-size:1rem;font-weight:900}
.eq{font-size:.88rem;color:var(--muted);font-weight:700}
.why{background:var(--soft);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:.9rem}
.why b{color:var(--meadow)}
.prod{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}
.prod .i{font-size:1.7rem;line-height:1.2}
.prod p{margin:0;font-size:.88rem}
.tag{display:inline-block;background:var(--sun);color:#3a2c00;border-radius:6px;padding:0 6px;font-size:.7rem;font-weight:900;margin-left:4px;vertical-align:2px}
.gasnote{font-size:.75rem;color:var(--muted)}

/* 探検・工作・図鑑 共通カード */
.grid2{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px}
.card.locked{opacity:.65}
.card h3{margin:0;font-size:1.02rem;font-weight:900;display:flex;gap:8px;align-items:center}
.card h3 .i{font-size:1.5rem}
.card .kid{font-size:.86rem;color:var(--muted);margin:4px 0 8px}
.res{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.res .i{font-size:1.3rem;width:1.6em;text-align:center}
.res .nm{flex:1;min-width:0;font-weight:700;font-size:.9rem;line-height:1.35}
.res .nm small{display:block;color:var(--muted);font-weight:500;font-size:.74rem}
.auto{border:1.5px solid var(--line);background:var(--soft);border-radius:10px;padding:4px 7px;font-size:.75rem;font-weight:700;cursor:pointer}
.auto[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#3a2c00}
.pop{animation:popn .5s ease-out}
@keyframes popn{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.need{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.need span{font-size:.78rem;border-radius:8px;padding:2px 7px;background:var(--soft);border:1.5px solid var(--line);font-weight:700}
.need span.ok{border-color:var(--meadow);color:var(--meadow)}
.need span.ng{border-color:var(--clay);color:var(--clay)}
.how{font-size:.8rem;color:var(--muted)}
.sec{font-weight:900;font-size:1rem;margin:18px 0 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.sec small{font-weight:700;color:var(--muted);font-size:.78rem}

/* 図鑑 */
.bars{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:10px}
.bar{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 9px;font-size:.78rem;font-weight:700;cursor:pointer;text-align:left}
.bar[aria-pressed="true"]{border-color:var(--meadow)}
.bar .m{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.bar .m i{display:block;height:100%;background:var(--meadow)}
.dex{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(94px,1fr))}
.dx{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.dx .i{font-size:1.7rem;line-height:1.2}
.dx .n{font-size:.74rem;font-weight:700;line-height:1.3}
.dx.hidden .i{filter:grayscale(1) brightness(.4);opacity:.5}
.dx.hinted{border-style:dashed;border-color:var(--sun)}
.oplist{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.opc{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.84rem}
.opc b{font-size:.95rem}

/* パネル（メニュー）：マップの上に重ねる。同時に開くのは1つだけ */
.scrim{position:absolute;inset:0;z-index:38;background:rgba(10,20,30,.3)}
.dock{position:absolute;z-index:40;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -6px 28px rgba(0,0,0,.3)}
.dock[hidden],.scrim[hidden]{display:none}
.dockhd{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;border-bottom:1.5px solid var(--line);background:var(--card)}
.dockhd h2{flex:1;margin:0;font-size:1.1rem;font-weight:900;outline:none}
.dockx{min-height:44px;min-width:48px;border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:0 12px;font:inherit;font-weight:900;cursor:pointer}
.dockbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:4px 14px 16px}
.dockbody>.sec:first-child{margin-top:8px}
.dock .labgrid{grid-template-columns:1fr}
.dock .labgrid .stagebox{position:relative;top:auto}
.dock .eras{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
[data-ui="touch"] .dock{left:0;right:0;bottom:var(--navh,64px);max-height:calc(100% - var(--navh,64px) - var(--sat) - 10px);border-radius:20px 20px 0 0;
  padding-left:var(--sal);padding-right:var(--sar)}
[data-ui="touch"] .dock[data-size="tall"]{top:calc(var(--sat) + 8px);max-height:none}
[data-ui="pc"] .dock{top:calc(var(--sat) + 12px);bottom:calc(var(--navh,72px) + 8px);right:calc(var(--sar) + 12px);width:min(560px,44vw);border-radius:20px}
[data-ui="pc"] .dock[data-size="wide"]{left:calc(var(--sal) + 24px);right:calc(var(--sar) + 24px);width:auto}
/* メニュー（スマホ）の大きな項目 */
.bigmenu{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin:10px 0}
.bigitem{min-height:72px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;display:flex;align-items:center;gap:10px;padding:10px 12px;font:inherit;font-weight:900;font-size:1rem;cursor:pointer;text-align:left}
.bigitem span{font-size:1.8rem}
.bigitem small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
.summary{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.helplist{margin:4px 0;padding-left:1.2em;font-size:.88rem}

/* モーダル */
.modal{position:fixed;inset:0;z-index:55;background:rgba(10,20,30,.45);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){ .modal{align-items:center} .sheet{border-radius:22px} }
.sheet .hd{display:flex;gap:12px;align-items:center}
.sheet .bigi{font-size:3rem;line-height:1}
.sheet h2{margin:0;font-size:1.3rem;font-weight:900;line-height:1.3}
.sheet .yomi{font-size:.8rem;color:var(--muted)}
.kidbox{background:var(--soft);border-radius:14px;padding:10px 12px;margin:12px 0;font-size:1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.86rem;margin:8px 0}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0}
.sheet h5{margin:14px 0 4px;font-size:.88rem;font-weight:900}
.sheet ul{margin:0;padding-left:1.2em;font-size:.86rem}
.close{float:right;border:none;background:var(--soft);border-radius:10px;padding:4px 12px;min-height:44px;min-width:44px;cursor:pointer;font-weight:900}

/* 技術マップ */
.eras{display:grid;gap:10px}
@media (min-width:900px){ .eras{grid-template-columns:repeat(5,1fr)} }
.era{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px}
.era.future{opacity:.6;border-style:dashed}
.era h4{margin:0;font-size:.9rem;font-weight:900}
.era p{margin:2px 0 8px;font-size:.75rem;color:var(--muted)}
.tn{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:4px 6px;border-radius:8px;margin-bottom:3px;border:1.5px solid transparent;cursor:pointer;width:100%;background:none;text-align:left}
.tn.done{background:var(--soft);border-color:var(--meadow)}
.tn.can{border-color:var(--sun)}
.tn.hint{border-color:var(--line);border-style:dashed}
.tn.none{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.75rem;color:var(--muted);margin:6px 0}
.tree{font-size:.86rem}
.tree ul{list-style:none;margin:0;padding-left:16px;border-left:2px solid var(--line)}
.tree>ul{border-left:none;padding-left:0}
.tree li{margin:4px 0}
.tree .nd{display:inline-flex;align-items:center;gap:5px;background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:2px 8px;font-weight:700}
.tree .nd.k{border-color:var(--meadow)}
.tree .via{font-size:.75rem;color:var(--muted);margin-left:4px}
select{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:7px;background:var(--card);color:var(--ink);max-width:100%}

/* 記録 */
.hist{font-size:.84rem}
.hist .h{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.hist .h .t{flex:1;min-width:0}
textarea{width:100%;min-height:90px;font:inherit;font-size:.75rem;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--soft);color:var(--ink)}
.tests li{font-size:.82rem}
.status li{font-size:.86rem}

/* 発見トースト */
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 112px);z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
[data-ui="pc"] .toasts{top:calc(env(safe-area-inset-top,0px) + 12px)}
/* タッチ用：通知は1行に縮め、説明は図鑑で読む（パネルや操作を隠さない） */
[data-ui="touch"] .toast{padding:6px 10px;border-radius:14px;gap:8px;align-items:center}
[data-ui="touch"] .toast p{display:none}
[data-ui="touch"] .toast .i{font-size:1.5rem}
[data-ui="touch"] .toast .nm{font-size:.92rem}
@media (max-height:500px) and (orientation:landscape){
  [data-ui="touch"] .toasts{left:calc(env(safe-area-inset-left,0px) + 10px);transform:none;top:calc(env(safe-area-inset-top,0px) + 104px);width:min(36vw,320px)}
}
.toast{pointer-events:auto;background:var(--card);border:2.5px solid var(--sun);border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast .i{font-size:2.1rem;line-height:1}
.toast .k{font-size:.72rem;font-weight:900;color:#a07400}
.toast .nm{font-weight:900;font-size:1.02rem;line-height:1.3}
.toast p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
.toast.small{border-color:var(--meadow)}
@media (prefers-reduced-motion:no-preference){ .toast{animation:tin .45s cubic-bezier(.2,1.4,.4,1)} }
@keyframes tin{from{transform:translateY(16px) scale(.92);opacity:0}to{transform:none;opacity:1}}


/* フィールド */
.field{position:relative;width:100%;aspect-ratio:4/3;max-height:62vh;border-radius:20px;overflow:hidden;border:2px solid var(--line);background:var(--land)}
@media (min-width:900px){ .field{aspect-ratio:16/9;max-height:none} }
.fieldsvg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;padding:2px;z-index:2}
.pin .pi{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--card);border:2.5px solid var(--meadow);font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.pin .pn{font-size:.68rem;font-weight:900;background:rgba(255,255,255,.9);color:#22305a;border-radius:6px;padding:0 5px;margin-top:2px;white-space:nowrap}
.pin.lock .pi{border-color:var(--line);filter:grayscale(1);opacity:.75}
.pin.here .pi{border-color:var(--sun);box-shadow:0 0 0 4px rgba(242,182,50,.45)}
.pin.shake{animation:pshake .35s}
@keyframes pshake{25%{transform:translate(-56%,-50%)}75%{transform:translate(-44%,-50%)}}
.avatar{position:absolute;transform:translate(-50%,-125%);font-size:1.6rem;z-index:3;pointer-events:none;transition:left .7s ease-in-out,top .7s ease-in-out;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.avatar.walk{animation:hop .18s ease-in-out infinite alternate}
@keyframes hop{to{transform:translate(-50%,-140%)}}
.regioncard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px;margin-top:12px}
.rhead{display:flex;gap:10px;align-items:flex-start}
.rhead .ri{font-size:2rem;line-height:1}
.rhead h3{margin:0;font-size:1.1rem;font-weight:900}
.rhead .kid{font-size:.84rem;color:var(--muted)}
.lv{min-width:92px;text-align:right;font-size:.78rem}
.lv .m{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:3px 0 1px}
.lv .m i{display:block;height:100%;background:var(--sun)}
.lv small{color:var(--muted)}
.rscene{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);margin:6px 0;user-select:none;-webkit-user-select:none}
.rscene svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:0;z-index:2;touch-action:manipulation}
.node .ni{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;font-size:1.6rem;background:radial-gradient(circle,rgba(255,255,255,.95) 55%,rgba(255,255,255,.55));box-shadow:0 0 0 3px rgba(242,182,50,.9),0 4px 10px rgba(0,0,0,.25)}
.node .nl{font-size:.66rem;font-weight:900;background:rgba(255,255,255,.9);color:#22305a;border-radius:6px;padding:0 5px;margin-top:3px;white-space:nowrap}
.node .pips{font-size:.5rem;color:#f2b632;letter-spacing:1px;line-height:1;text-shadow:0 0 2px #000;min-height:.6rem}
.node.nlock .ni{box-shadow:0 0 0 2px rgba(255,255,255,.5);background:rgba(255,255,255,.55);filter:grayscale(1)}
.node.regrow .ni{background:conic-gradient(rgba(127,191,143,.95) calc(var(--p)*1%),rgba(255,255,255,.35) 0);box-shadow:none;opacity:.8}
@media (prefers-reduced-motion:no-preference){
  .node:not(.nlock):not(.regrow) .ni{animation:glowp 1.6s ease-in-out infinite}
  .node.hit .ni{animation:hitn .3s ease-out}
  .scene .x-electric path{animation:spark .15s linear infinite}
  .scene .x-chain text{animation:bob .4s ease-in-out infinite alternate}
  .spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}
  .waves{animation:wave 1.6s ease-in-out infinite alternate}
  .fsmoke{animation:rise 3s ease-out infinite}
  .train{offset-path:path("M112 178 Q220 150 256 84 Q300 100 336 112");animation:trainrun 9s linear infinite alternate}
}
@keyframes glowp{50%{box-shadow:0 0 0 6px rgba(242,182,50,.45),0 4px 10px rgba(0,0,0,.25)}}
@keyframes hitn{0%{transform:scale(1)}40%{transform:scale(.82) rotate(-8deg)}100%{transform:scale(1)}}
@keyframes trainrun{from{offset-distance:0%}to{offset-distance:100%}}
.float{position:absolute;transform:translate(-50%,-160%);font-weight:900;font-size:.95rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none;z-index:4;white-space:nowrap}
.float.crit{color:#ffd84a;font-size:1.15rem}
.float.ng{color:#ffd0c8;font-size:.78rem}
@media (prefers-reduced-motion:no-preference){ .float{animation:floatup 1.1s ease-out forwards} }
@keyframes floatup{from{opacity:1;transform:translate(-50%,-140%)}to{opacity:0;transform:translate(-50%,-300%)}}
.swing{position:absolute;transform:translate(-10%,-110%);font-size:1.6rem;pointer-events:none;z-index:3}
@media (prefers-reduced-motion:no-preference){ .swing{animation:swing .45s ease-out forwards;transform-origin:20% 90%} }
@keyframes swing{from{transform:translate(-10%,-110%) rotate(-50deg)}to{transform:translate(-10%,-110%) rotate(30deg);opacity:.2}}
.combo{position:absolute;right:8px;top:8px;background:#f2b632;color:#3a2c00;border-radius:999px;padding:2px 10px;font-weight:900;font-size:.85rem;opacity:0;transition:opacity .2s;z-index:4}
.combo.on{opacity:1}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(34,48,90,.92);color:#fff;border:2px solid #f2b632;border-radius:14px;padding:8px 14px;font-weight:900;font-size:1rem;opacity:0;pointer-events:none;z-index:5;text-align:center;max-width:90%}
.banner.on{animation:bannerin 2.2s ease-out forwards}
@keyframes bannerin{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0}}
.reslist{margin-top:4px}
@media (min-width:700px){ .rscene{aspect-ratio:16/9} }
@media (max-width:699px){ .node .ni{width:44px;height:44px;font-size:1.4rem} .pin .pi{width:34px;height:34px;font-size:1.1rem} .pin .pn{font-size:.62rem} }


/* 研究室の背景イラスト */
.stagebox{aspect-ratio:16/9;background:#e9dcc3}
.benchcol{display:flex;flex-direction:column;gap:6px}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;counter-reset:st;flex-wrap:wrap}
.steps li{counter-increment:st;font-size:.74rem;font-weight:900;border-radius:999px;padding:2px 9px;background:var(--soft);border:1.5px solid var(--line);color:var(--muted)}
.steps li::before{content:counter(st) " "}
.steps li.done{border-color:var(--meadow);color:var(--meadow)}
.steps li.now{background:var(--meadow);border-color:var(--meadow);color:var(--meadow-ink)}
.runbar{position:sticky;bottom:-16px;z-index:2;display:flex;gap:8px;align-items:center;margin:10px -12px -12px;padding:10px 12px;background:var(--card);border-top:1.5px solid var(--line);border-radius:0 0 18px 18px}
[data-ui="pc"] .dock[data-size="wide"] .labgrid{grid-template-columns:1.05fr .95fr;align-items:start}
[data-ui="pc"] .dock[data-size="wide"] .labgrid .benchcol{position:sticky;top:8px}
/* 3Dフィールド（ステージ全体） */
.w3{position:absolute;inset:0;background:#3b5a3a}
.w3slot,.w3canvas{position:absolute;inset:0}
.w3canvas canvas{display:block;width:100%;height:100%}
.w3labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.w3lab{position:absolute;left:0;top:0;pointer-events:auto;border:none;border-radius:999px;padding:3px 9px 3px 5px;min-height:30px;background:rgba(255,255,255,.94);color:#22305a;font:inherit;font-size:.74rem;font-weight:900;display:flex;align-items:center;gap:3px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.w3lab span{font-size:1rem}
.w3lab i{font-style:normal;color:#b07d00;font-size:.5rem;letter-spacing:1px}
.w3lab.near{outline:3px solid #f2b632}
.w3lab.lock{background:rgba(232,232,232,.92);color:#444}
.w3lab.regrow{opacity:.65}
.hud .combo{position:absolute;right:calc(var(--sar) + 12px);top:calc(var(--sat) + 70px);left:auto}
.hud .banner{top:32%}
.joy{position:absolute;left:calc(var(--sal) + 18px);bottom:calc(var(--navh,64px) + 18px);width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.65);touch-action:none;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.joy .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.3)}
[data-ui="pc"]:not(.touched) .joy{display:none}
.game.docked .w3act,.game.docked .joy{visibility:hidden}
.w3act{position:absolute;z-index:3;border:none;font:inherit;font-weight:900;background:#f2b632;color:#3a2c00;box-shadow:0 4px 0 rgba(0,0,0,.28),0 4px 14px rgba(0,0,0,.25);cursor:pointer;touch-action:manipulation}
.w3act small{font-weight:700}
.w3act.lock{background:#e6e6e6;color:#444}
.w3act.idle{background:rgba(255,255,255,.92);color:#22305a}
.w3act.busy{background:linear-gradient(90deg,#f2b632 var(--p,0%),#fff2c9 var(--p,0%));color:#3a2c00}
.w3lab small{font-weight:700;color:#4a5566}
[data-ui="touch"] .w3act{right:calc(var(--sar) + 16px);bottom:calc(var(--navh,64px) + 20px);min-width:112px;min-height:88px;max-width:min(46vw,220px);border-radius:24px;padding:10px 14px;font-size:1rem;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center}
[data-ui="touch"] .w3act .ai{font-size:1.7rem;line-height:1.1}
[data-ui="pc"] .w3act{left:50%;transform:translateX(-50%);bottom:calc(var(--navh,72px) + 14px);min-height:48px;border-radius:16px;padding:8px 18px;font-size:1rem;display:flex;align-items:center;gap:8px;max-width:70vw}
[data-ui="pc"] .w3act.idle{display:none}
.w3loading{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(30,40,30,.55);color:#fff;font-weight:900}
.w3loading small{font-weight:500;opacity:.85}
.travel{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.tchip{cursor:pointer;font:inherit;font-size:.9rem;min-height:44px;padding:4px 12px}
.tchip.lockc{opacity:.75}
.tchip.here{border-color:var(--sun);box-shadow:0 0 0 3px rgba(242,182,50,.35)}
/* 2D表示（3Dが使えないとき）：地域の場面をステージ全体に */
.stage .rscene{position:absolute;inset:0;aspect-ratio:auto;border:none;border-radius:0;margin:0}
.stage .rnodes{position:absolute;left:calc(var(--sal) + 16px);right:calc(var(--sar) + 16px);top:calc(var(--sat) + 120px);bottom:calc(var(--navh,64px) + 64px)}
.note2d{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--navh,64px) + 10px);z-index:3;max-width:min(92vw,520px);background:rgba(255,255,255,.95);color:#22305a;border-radius:12px;padding:6px 12px;font-size:.8rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)}
/* 主人公スプライト（4×4シートの1コマ目） */
.hero{display:inline-block;width:44px;height:44px;background-size:400% calc(var(--hero-rows,4)*100%);background-position:0 0;background-repeat:no-repeat;image-rendering:pixelated}
.hero.big{width:72px;height:72px}
.avatar.hero{width:40px;height:40px;font-size:0}
.heropick{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 14px;display:flex;flex-direction:column;align-items:center;font:inherit;font-weight:900;cursor:pointer;color:var(--ink)}
.heropick[aria-pressed="true"]{border-color:var(--meadow);box-shadow:0 0 0 3px rgba(62,107,74,.25)}

/* 横向きのスマホ：高さが低いので、ナビを細く・操作を小さめに */
@media (max-height:500px) and (orientation:landscape){
  [data-ui="touch"] .nav button{min-height:44px;flex-direction:row;gap:6px;font-size:.78rem}
  [data-ui="touch"] .nav button span{font-size:1.1rem}
  [data-ui="touch"] .nav{left:50%;right:auto;transform:translateX(-50%);width:min(520px,70vw);border-radius:16px 16px 0 0}
  .joy{width:104px;height:104px;bottom:calc(var(--sab) + 12px)}
  [data-ui="touch"] .w3act{bottom:calc(var(--sab) + 12px);min-height:76px;min-width:100px}
  .hud-tl{max-width:min(42vw,380px)}
  [data-ui="touch"] .dock{left:auto;right:calc(var(--sar) + 8px);width:min(520px,62vw);top:calc(var(--sat) + 8px);border-radius:20px 20px 0 0}
}

/* シーンの演出 */
.fx{opacity:0;transition:opacity .25s}
.idle-flame{transform-box:fill-box;transform-origin:50% 100%}
.cnt{transition:fill .8s ease}
.scene.f-flame .x-flame,.scene.f-glow .x-glow,.scene.f-smoke .x-smoke,.scene.f-steam .x-steam,.scene.f-bubbles .x-bubbles,
.scene.f-crystal .x-crystal,.scene.f-sink .x-sink,.scene.f-drip .x-drip,.scene.f-ddrip .x-ddrip,.scene.f-sparks .x-sparks,
.scene.f-swirl .x-swirl,.scene.f-frost .x-frost,.scene.f-shape .x-shape,.scene.f-dry .x-dry,.scene.f-ferment .x-ferment,.scene.f-sparkle .x-sparkle,.scene.f-grind .x-grind,.scene.f-electric .x-electric,.scene.f-chain .x-chain{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .idle-flame{animation:flick .6s ease-in-out infinite alternate}
  .x-flame path{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
  .x-flame path:nth-child(2){animation-delay:.1s}
  .x-glow circle{animation:glow 1s ease-in-out infinite alternate}
  .scene .x-smoke circle,.scene .x-steam circle{animation:rise 1.6s ease-out infinite}
  .scene .x-smoke circle:nth-child(2),.scene .x-steam circle:nth-child(2){animation-delay:.5s}
  .scene .x-smoke circle:nth-child(3),.scene .x-steam circle:nth-child(3){animation-delay:1s}
  .scene .x-bubbles circle{animation:bub 1s ease-in infinite}
  .scene .x-bubbles circle:nth-child(2){animation-delay:.3s}.scene .x-bubbles circle:nth-child(3){animation-delay:.6s}.scene .x-bubbles circle:nth-child(4){animation-delay:.15s}
  .scene .x-sink circle{animation:sink 1.4s ease-in infinite}
  .scene .x-sink circle:nth-child(2){animation-delay:.4s}.scene .x-sink circle:nth-child(3){animation-delay:.8s}
  .scene .x-drip circle,.scene .x-ddrip circle{animation:drip .7s ease-in infinite}
  .scene .x-drip circle:nth-child(2),.scene .x-ddrip circle:nth-child(2){animation-delay:.35s}
  .scene .x-sparks{animation:shake .12s linear infinite}
  .scene .x-sparks line{animation:spark .4s ease-out infinite}
  .scene .x-swirl g{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
  .scene .x-grind g{transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite}
  .scene .x-crystal path{transform-box:fill-box;transform-origin:center;animation:grow 1.4s ease-out both}
  .scene .x-crystal path:nth-child(2){animation-delay:.3s}.scene .x-crystal path:nth-child(3){animation-delay:.6s}.scene .x-crystal path:nth-child(4){animation-delay:.9s}
  .scene .x-shape text,.scene .x-ferment text{animation:bob .5s ease-in-out infinite alternate}
  .scene .x-dry path{animation:wave 1s ease-in-out infinite alternate}
  .scene .x-sparkle text{transform-box:fill-box;transform-origin:center;animation:twinkle .9s ease-out both}
  .scene .x-sparkle text:nth-child(2){animation-delay:.15s}.scene .x-sparkle text:nth-child(3){animation-delay:.3s}
  .scene.f-shape .cnt{transform-box:fill-box;transform-origin:50% 100%;animation:squash .5s ease-in-out infinite alternate}
}
@keyframes flick{from{transform:scaleY(.85) scaleX(1.05)}to{transform:scaleY(1.12) scaleX(.95)}}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.8}100%{transform:translateY(-46px) scale(1.5);opacity:0}}
@keyframes bub{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
@keyframes sink{0%{transform:translateY(-24px);opacity:0}30%{opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(20px);opacity:0}}
@keyframes shake{0%,100%{transform:translate(0,0)}50%{transform:translate(1.5px,-1px)}}
@keyframes spark{from{opacity:1}to{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes wave{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes twinkle{0%{transform:scale(0);opacity:0}50%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:.9}}
@keyframes squash{from{transform:scale(1,1)}to{transform:scale(1.08,.9)}}
@media (prefers-reduced-motion:reduce){ .fx{transition:none} .cnt{transition:none} }
</style>
</head>

<div class="game" id="app" data-ui="pc">
  <main id="view" class="stage" aria-label="探索フィールド"></main>
  <div class="hud" id="hud">
    <div class="hud-tl"><button class="vbadge" id="vbadge" data-tab="verify" hidden title="検証モードのメニューを開く">🧪 検証モード：全解放</button><div class="loc" id="hudLoc" role="status"></div><div id="mission" class="missionwrap"></div></div>
    <div class="hud-tr">
      <button class="hbtn" data-tab="world" data-icon="map" title="地図：地域を選んで移動する" aria-expanded="false"><span class="ico">🗺️</span>地図</button>
      <button class="hbtn" data-act="home" data-icon="home" data-only="pc" title="拠点へ戻る"><span class="ico">🏠</span>拠点</button>
      <button class="hbtn" data-tab="settings" data-icon="settings" title="設定・ヘルプ" aria-expanded="false"><span class="ico">⚙️</span>設定</button>

    <div class="joy" id="joy" aria-label="移動スティック"><div class="knob"></div></div>
    <button class="w3act idle" id="w3act" data-act="g3" hidden></button>
    <div class="camctl" id="camctl" hidden><button data-act="cam" data-id="reset" title="視点を標準の角度と距離に戻す（ドラッグで回転・ホイール／2本指で距離）" aria-label="視点を戻す">🎥<span>視点を戻す</span></button></div>
    <div class="buildbar" id="buildbar" hidden role="group" aria-label="建物の置き場所を決める">
      <div class="bbtitle" id="bbTitle"></div><div class="bbmsg" id="bbMsg" role="status"></div>
      <div class="bbrow"><button data-act="b-rot" data-id="-90" title="左へ90度（Shift+R）">⟲90°</button><button data-act="b-rot" data-id="-15" title="左へ15度">⟲15°</button><button data-act="b-rot" data-id="15" title="右へ15度（R）">⟳15°</button><button data-act="b-rot" data-id="90" title="右へ90度">⟳90°</button>
        <label class="bbgrid"><input type="checkbox" id="bbGrid" data-act="b-grid" checked>グリッド吸着</label></div>
      <div class="bbrow"><button class="bbok" data-act="b-ok" title="ここに置く（Enter）">ここに置く</button><button data-act="b-cancel" title="やめる（Esc）">やめる</button></div>
    </div>
  </div>
  <div class="scrim" id="scrim" data-act="closepanel" hidden></div>
  <section class="dock" id="dock" role="dialog" aria-labelledby="dockTitle" hidden>
    <div class="dockhd"><h2 id="dockTitle" tabindex="-1"></h2><button class="dockx" data-act="closepanel" aria-label="閉じて探索に戻る" title="閉じる（Esc）">✕ 閉じる</button></div>
    <div class="dockbody" id="dockBody"></div>
  </section>
  <nav class="nav" id="nav" aria-label="メニュー">
    <button data-tab="lab" data-icon="lab" title="研究室：材料・装置・操作を選んで実験"><span class="ico">🧪</span>研究室</button>
    <button data-tab="craft" data-icon="craft" title="工作：道具や設備を作る"><span class="ico">🔨</span>工作</button>
    <button data-tab="book" data-icon="book" data-only="pc" title="図鑑：見つけたものの説明"><span class="ico">📖</span>図鑑</button>
    <button data-tab="map" data-icon="tech" data-only="pc" title="技術マップ：技術と物質のつながり"><span class="ico">🕸️</span>技術</button>
    <button data-tab="log" data-icon="log" data-only="pc" title="記録：実験の記録とセーブデータ"><span class="ico">📓</span>記録</button>
    <button data-tab="build" data-icon="home" data-only="pc" title="建築：作った家や設備を好きな場所に置く"><span class="ico">🏗️</span>建築</button>
    <button data-tab="menu" data-icon="menu" data-only="touch" title="メニュー：図鑑・技術・記録・設定"><span class="ico">☰</span>メニュー</button>
  </nav>
</div>
