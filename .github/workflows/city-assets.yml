name: City asset integration
on:
  push:
    branches: [feature/game-city-formal-assets-20261114]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: construction-source
          path: assets/construction/
          retention-days: 7
