name: Rocket integration gates
on:
  push:
    branches: [feature/game-rocket-finish-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run e2e
      - if: ${{ !cancelled() }}
        run: npm run e2e:space
      - if: ${{ !cancelled() }}
        run: node tests/e2e/hero-8dir.mjs --suit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rocket-validation
          path: |
            test-results
            dist
