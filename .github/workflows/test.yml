name: テスト
# main への push は「GitHub Pages に公開（main のみ）」が同じ検証（test・typecheck・build・e2e）をしてから公開するので、ここでは重ねて実行しない
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
