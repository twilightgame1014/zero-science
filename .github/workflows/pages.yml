name: GitHub Pages に公開
# push 連動で自動公開（オーナー決定 2026-11-15）。
# このファイルを含むブランチへの push が、そのブランチのビルドで公開版を更新する。
# テストが落ちた push は公開されない（build ジョブが失敗したら deploy は走らない）。
# 手動実行（workflow_dispatch）も引き続き使える。
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
