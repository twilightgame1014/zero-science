<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科学系UI デザインモック（2026-11-11）</title>
<style>
  :root{
    --bg-deep:#0C141C; --panel:#16212E; --raised:#1D2B3A; --inset:#101A24;
    --line:#2E4256; --line-strong:#3D5A74;
    --text:#EDE6D2; --text2:#B4BBA9; --text3:#77879A;
    --teal:#3FA08E; --teal-bright:#57C2AC;
    --amber:#D9A441; --amber-deep:#B97F26;
    --warn:#C05B4D; --gray:#5C6B7A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#06090D; color:var(--text); font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
       display:flex; gap:48px; padding:40px; align-items:flex-start; flex-wrap:wrap;}
  .cap{font-size:12px; color:#8fa3b8; margin-bottom:10px; letter-spacing:.08em;}
  .scene{position:relative; width:1080px; height:660px; border-radius:6px; overflow:hidden;
         background:linear-gradient(180deg,#2c3e50 0%,#57493a 55%,#3a4a35 100%);}
  .scene::after{content:"探索画面（ダミー）"; position:absolute; left:24px; bottom:20px; color:#ffffff55; font-size:13px;}
  .panel{position:absolute; top:0; right:0; width:380px; height:100%; background:var(--panel);
         border-left:1px solid var(--line-strong); display:flex;}
  .rail{width:64px; background:var(--bg-deep); border-right:1px solid var(--line);
        display:flex; flex-direction:column; align-items:stretch; padding-top:12px;}
  .tab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 7px;
       color:var(--text2); font-size:10px; letter-spacing:.06em; border-left:3px solid transparent; cursor:pointer;}
  .tab img{width:32px; height:32px; image-rendering:pixelated; opacity:.55;}
  .tab.sel{background:var(--raised); border-left-color:var(--teal); color:var(--text);}
  .tab.sel img{opacity:1;}
  .tab.focus{outline:2px solid var(--teal-bright); outline-offset:-2px;}
  .body{flex:1; display:flex; flex-direction:column; min-width:0;}
  .ptitle{padding:16px 16px 10px; display:flex; align-items:baseline; gap:10px;}
  .ptitle h1{font-size:17px; font-weight:600;}
  .ptitle span{font-size:11px; color:var(--text3); letter-spacing:.08em;}
  .sec{padding:10px 16px 6px; font-size:11px; color:var(--text3); letter-spacing:.14em; display:flex; align-items:center; gap:8px;}
  .sec::before{content:""; width:14px; border-top:1px solid var(--line-strong);}
  .list{padding:2px 8px;}
  .row{display:flex; align-items:center; gap:10px; min-height:44px; padding:6px 8px; border-radius:6px; position:relative;}
  .row + .row{border-top:1px solid #22344A;}
  .row::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:2px; background:transparent;}
  .row.ok::before{background:var(--teal);}
  .row.lack::before{background:var(--warn);}
  .row.fac::before{background:var(--amber);}
  .row.unk{opacity:.75;}
  .row img{width:32px; height:32px; image-rendering:pixelated;}
  .row.unk img{opacity:.35; filter:grayscale(1);}
  .row .nm{flex:1; font-size:14px; min-width:0;}
  .row.unk .nm{color:var(--text3);}
  .row .meta{font-size:12px; color:var(--text2); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .row .meta.bad{color:var(--warn);}
  .row .meta.fac{color:var(--amber);}
  .detail{margin:10px 16px 0; border-top:1px solid var(--line); padding-top:12px;}
  .dhead{display:flex; gap:12px; align-items:center;}
  .dic{width:56px; height:56px; background:var(--inset); border-radius:8px; display:flex; align-items:center; justify-content:center;}
  .dic img{width:48px; height:48px; image-rendering:pixelated;}
  .dhead h2{font-size:17px; font-weight:600;}
  .tag{display:inline-block; margin-top:3px; font-size:11px; color:var(--text2); background:var(--raised);
       border-radius:4px; padding:2px 7px;}
  .recipe{margin-top:10px;}
  .rrow{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13px;}
  .rrow img{width:24px; height:24px; image-rendering:pixelated;}
  .rrow .cnt{margin-left:auto; font-size:12px; color:var(--text2); font-variant-numeric:tabular-nums;}
  .rrow .cnt.bad{color:var(--warn);}
  .pfoot{margin-top:auto; padding:12px 16px 16px; border-top:1px solid var(--line);}
  .btn{display:block; width:100%; height:44px; border:none; border-radius:6px; font-size:14px; font-weight:600;
       background:var(--amber); color:#20180A; cursor:pointer;}
  .btn:hover{background:var(--amber-deep);}
  .btn:disabled{background:var(--inset); color:var(--gray); cursor:default;}
  .why{font-size:12px; color:var(--warn); margin-top:8px; text-align:center;}
  .why.amber{color:var(--amber);}
  /* ---------- phone ---------- */
  .phone{position:relative; width:375px; height:667px; border-radius:18px; overflow:hidden;
         background:linear-gradient(180deg,#33475c 0%,#5c4c3b 60%,#41523c 100%); border:1px solid #2b3a49;}
  .sheet{position:absolute; left:0; right:0; bottom:56px; max-height:78%; background:var(--panel);
         border-radius:12px 12px 0 0; padding-bottom:12px;}
  .handle{width:36px; height:4px; border-radius:2px; background:var(--line-strong); margin:8px auto 4px;}
  .sheet .ptitle{padding:8px 16px 6px;}
  .bnav{position:absolute; left:0; right:0; bottom:0; height:56px; background:var(--bg-deep);
        border-top:1px solid var(--line); display:flex;}
  .bnav .tab{flex:1; border-left:none; border-top:3px solid transparent; padding:6px 0 4px;}
  .bnav .tab img{width:28px; height:28px;}
  .bnav .tab.sel{border-top-color:var(--teal); background:transparent;}
</style>
</head>
<body>
<div>
  <div class="cap">PC ― 右サイドパネル（幅380px／レール64px）</div>
  <div class="scene">
    <div class="panel">
      <nav class="rail">
        <div class="tab sel"><img src="../ui-icons/48/lab.png" alt="">研究室</div>
        <div class="tab"><img src="../ui-icons/48/craft.png" alt="">工作</div>
        <div class="tab"><img src="../ui-icons/48/encyclopedia.png" alt="">図鑑</div>
        <div class="tab"><img src="../ui-icons/48/journal.png" alt="">記録</div>
        <div class="tab"><img src="../ui-icons/48/map.png" alt="">地図</div>
        <div class="tab focus"><img src="../ui-icons/48/settings.png" alt="">設定</div>
      </nav>
      <div class="body">
        <div class="ptitle"><h1>研究室</h1><span>LABORATORY</span></div>
        <div class="sec">実験できるもの</div>
        <div class="list">
          <div class="row ok"><img src="../ui-icons/48/lab.png" alt=""><div class="nm">石ころを砕く</div><div class="meta">3 / 5</div></div>
          <div class="row ok"><img src="../ui-icons/48/craft.png" alt=""><div class="nm">木の棒を削る</div><div class="meta">2 / 4</div></div>
          <div class="row lack"><img src="../ui-icons/48/encyclopedia.png" alt=""><div class="nm">粘土を焼く</div><div class="meta bad">あと2</div></div>
          <div class="row fac"><img src="../ui-icons/48/technology.png" alt=""><div class="nm">ガラスを溶かす</div><div class="meta fac">窯が必要</div></div>
          <div class="row unk"><img src="../ui-icons/48/journal.png" alt=""><div class="nm">？？？</div><div class="meta"></div></div>
        </div>
        <div class="detail">
          <div class="dhead">
            <div class="dic"><img src="../ui-icons/48/encyclopedia.png" alt=""></div>
            <div><h2>粘土を焼く</h2><span class="tag">実験 ・ 土</span></div>
          </div>
          <div class="sec" style="padding-left:0">材料</div>
          <div class="recipe">
            <div class="rrow"><img src="../ui-icons/48/lab.png" alt="">粘土<div class="cnt bad">1 / 3</div></div>
            <div class="rrow"><img src="../ui-icons/48/craft.png" alt="">木の棒<div class="cnt">4 / 2</div></div>
          </div>
        </div>
        <div class="pfoot">
          <button class="btn" disabled>実験する</button>
          <div class="why">材料が足りません（粘土 あと2）</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div>
  <div class="cap">スマホ ― 下部ナビ＋ボトムシート</div>
  <div class="phone">
    <div class="sheet">
      <div class="handle"></div>
      <div class="ptitle"><h1>研究室</h1><span>LABORATORY</span></div>
      <div class="list">
        <div class="row ok"><img src="../ui-icons/48/lab.png" alt=""><div class="nm">石ころを砕く</div><div class="meta">3 / 5</div></div>
        <div class="row lack"><img src="../ui-icons/48/encyclopedia.png" alt=""><div class="nm">粘土を焼く</div><div class="meta bad">あと2</div></div>
        <div class="row fac"><img src="../ui-icons/48/technology.png" alt=""><div class="nm">ガラスを溶かす</div><div class="meta fac">窯が必要</div></div>
        <div class="row unk"><img src="../ui-icons/48/journal.png" alt=""><div class="nm">？？？</div><div class="meta"></div></div>
      </div>
      <div class="pfoot" style="border-top:none">
        <button class="btn" disabled>実験する</button>
        <div class="why">材料が足りません（粘土 あと2）</div>
      </div>
    </div>
    <nav class="bnav">
      <div class="tab sel"><img src="../ui-icons/48/lab.png" alt="">研究室</div>
      <div class="tab"><img src="../ui-icons/48/craft.png" alt="">工作</div>
      <div class="tab"><img src="../ui-icons/48/encyclopedia.png" alt="">図鑑</div>
      <div class="tab"><img src="../ui-icons/48/journal.png" alt="">記録</div>
      <div class="tab"><img src="../ui-icons/48/map.png" alt="">地図</div>
      <div class="tab"><img src="../ui-icons/48/settings.png" alt="">設定</div>
    </nav>
  </div>
</div>
</body>
</html>
